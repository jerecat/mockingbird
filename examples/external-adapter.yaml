plan: external-adapter-demo
sources: []

execution:
  # This module is NOT inside the mockingbird package. Install the example first:
  #   pip install -e examples/external_adapter
  adapter: example_mockingbird_adapter.adapter:Adapter
  config:
    tests:
      - id: external_pwd
        command: ["pwd"]
      - id: external_list
        command: ["ls", "-la"]

scheduler:
  capacity_provider: fixed
  max_parallel: 1
  poll_interval_s: 0.1
  config:
    slots: 1

