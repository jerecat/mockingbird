plan: linux-command-fail-demo
sources: []

execution:
  adapter: demo_linux
  config:
    tests:
      - id: passing_test
        command: ["ls", "-la"]
      - id: failing_test
        command: ["sh", "-c", "exit 7"]
      - id: another_passing_test
        command: ["mkdir", "-p", "another_scratch"]

scheduler:
  capacity_provider: fixed
  max_parallel: 1
  poll_interval_s: 0.2
  config:
    slots: 1
