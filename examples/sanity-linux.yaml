plan: linux-sanity
sources: []

# Normal integration path: declare the command contract only.
execution:
  defaults:
    command: ["./examples/sanity-run.sh"]
    timeout_s: 30
    collect:
      command: ["sh", "./examples/sanity-collect.sh"]
      timeout_s: 5
  jobs:
    - pwd
    - list_directory
    - make_directory
    - remove_directory

scheduler:
  capacity_provider: fixed
  max_parallel: 1
  poll_interval_s: 0.1
  config:
    slots: 1
